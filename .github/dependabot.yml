# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # pnpm workspace — the root lockfile covers apps/* and packages/*
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Keep tightly-coupled framework packages in single PRs
      nestjs:
        patterns:
          - "@nestjs/*"
      next:
        patterns:
          - "next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      tanstack:
        patterns:
          - "@tanstack/*"
      # Batch everything else by update size to cut PR noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors that cannot pass CI until something upstream of us moves first.
    # Dependabot reopens these every time a new major ships, so each one is
    # parked here with the exact condition that unblocks it — delete the entry
    # and let the PR land once that condition is met.
    ignore:
      # ts-jest declares `typescript: >=4.3 <7`, and TS 7 no longer exposes the
      # JS compiler API ts-jest needs, so the backend e2e suite cannot even
      # reach globalSetup. Unblocks when ts-jest ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react peers at `^9.7` max; under ESLint 10 its rules
      # crash on load (`contextOrFilename.getFilename is not a function`).
      # Unblocks when eslint-plugin-react adds an ESLint 10 peer range.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # archiver 8 is ESM-only (`"type": "module"`) while apps/backend compiles
      # to CommonJS, so `import archiver from 'archiver'` stops being callable
      # (TS2349). Unblocks when the backend moves to ESM.
      - dependency-name: "archiver"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"

  # Base images in the root Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
