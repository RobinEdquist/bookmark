name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bookmark

jobs:
  # ==========================================================================
  # Format, Lint, Type Check, and Unit Tests
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest check in the job, so it runs first. Fix locally with
      # `pnpm format`. Scope and exclusions live in .prettierrc/.prettierignore.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Run unit tests
        run: pnpm test

  # ==========================================================================
  # E2E Tests (Backend Authentication)
  # Uses Testcontainers to automatically manage PostgreSQL
  # ==========================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm --filter backend test:e2e
        env:
          # Testcontainers configuration
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ==========================================================================
  # Which architectures this run publishes.
  #
  # Everything that publishes an image — release tags and main — builds amd64
  # and arm64, so `edge` and `latest` are both multi-arch and arm64 breakage
  # shows up on the commit that caused it rather than during a release. The
  # arm64 runners are free for public repositories, so the second leg costs
  # wall-clock time only, and it runs in parallel with amd64.
  #
  # Pull requests stay amd64-only: they publish nothing, and a single-arch
  # build is enough to prove the image still builds.
  # ==========================================================================
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick platforms
        id: pick
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            MATRIX='[{"platform":"linux/amd64","runner":"ubuntu-latest"}]'
          else
            MATRIX='[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Building for: $MATRIX"

  # ==========================================================================
  # Build Combined Docker Image (backend + web in one deployable)
  #
  # One job per architecture on a native runner of that architecture — the
  # image builds Next.js, installs a Playwright Chromium and apt-installs
  # PostgreSQL, all of which are far too slow to emulate under QEMU. Each leg
  # pushes an untagged, digest-addressed image; the `publish` job below joins
  # them into a single multi-arch tag.
  # ==========================================================================
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [lint, e2e-tests, platforms]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags are the source of truth for the version, and the default
          # shallow clone cannot see them — git describe would silently
          # degrade to a bare SHA.
          fetch-depth: 0

      # GHCR rejects uppercase repository names, and the owner is mixed-case.
      # metadata-action lowercases `images` on its own, but the digest build
      # and the manifest merge address the repository directly.
      - name: Normalise image reference
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release build: the tag IS the version.
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Dev build: e.g. v0.1.0-12-ga1b2c3d => 0.1.0-12-ga1b2c3d, which
            # reads as "12 commits past v0.1.0, at a1b2c3d".
            DESCRIBED="$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || true)"
            case "$DESCRIBED" in
              v[0-9]*) VERSION="${DESCRIBED#v}" ;;
              # No version tag reachable yet (first-ever build).
              *) VERSION="0.0.0-dev+${DESCRIBED:-unknown}" ;;
            esac
          fi
          {
            echo "version=$VERSION"
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Pull requests only need to know the image still builds.
      - name: Build (pull request check)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          # Scoped per architecture: one shared scope would have the two legs
          # continually evicting each other's layers.
          cache-from: type=gha,scope=bookmark-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,scope=bookmark-${{ env.PLATFORM_SLUG }},mode=max

      # Pushed without a tag and addressed only by digest — `publish` collects
      # the digests and points the real tags at the resulting manifest list.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bookmark-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,scope=bookmark-${{ env.PLATFORM_SLUG }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Join the per-architecture images into one multi-arch tag.
  #
  # This runs for single-architecture builds too, so main and release builds
  # take an identical path and the release path cannot rot unnoticed.
  # ==========================================================================
  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalise image reference
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` tracks the latest RELEASE (metadata-action's default
          # latest=auto does this for semver tags), while main publishes to
          # `edge`. Pointing `latest` at the tip of main would mean every
          # first-time `docker compose up -d` pulled an unreleased build.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # Reads back what was actually published, so a run cannot report success
      # having pushed an index that is missing an architecture. Inspecting the
      # first tag from the metadata output rather than `steps.meta.outputs.version`
      # keeps this correct on main, where the published tag is `edge`.
      - name: Inspect published image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
