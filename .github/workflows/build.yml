name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bookmark

jobs:
  # ==========================================================================
  # Lint, Type Check, and Unit Tests
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Run unit tests
        run: pnpm test

  # ==========================================================================
  # E2E Tests (Backend Authentication)
  # Uses Testcontainers to automatically manage PostgreSQL
  # ==========================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm --filter backend test:e2e
        env:
          # Testcontainers configuration
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ==========================================================================
  # Build Combined Docker Image (backend + web in one deployable)
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    needs: [lint, e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags are the source of truth for the version, and the default
          # shallow clone cannot see them — git describe would silently
          # degrade to a bare SHA.
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release build: the tag IS the version.
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Dev build: e.g. v0.1.0-12-ga1b2c3d => 0.1.0-12-ga1b2c3d, which
            # reads as "12 commits past v0.1.0, at a1b2c3d".
            DESCRIBED="$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || true)"
            case "$DESCRIBED" in
              v[0-9]*) VERSION="${DESCRIBED#v}" ;;
              # No version tag reachable yet (first-ever build).
              *) VERSION="0.0.0-dev+${DESCRIBED:-unknown}" ;;
            esac
          fi
          {
            echo "version=$VERSION"
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks the latest RELEASE (metadata-action's default
          # latest=auto does this for semver tags), while main publishes to
          # `edge`. Pointing `latest` at the tip of main would mean every
          # first-time `docker compose up -d` pulled an unreleased build.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha,scope=bookmark
          cache-to: type=gha,scope=bookmark,mode=max
