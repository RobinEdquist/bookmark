# Docker Compose configuration for Bookmark
# Runs the pre-built image from GitHub Container Registry
#
# Usage:
#   1. Copy example.env to .env and configure (optional for a local try-out)
#   2. Run: docker compose up -d
#
# To build from source instead, add the build override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Access the application at http://localhost:3001

services:
  # ==========================================================================
  # Bookmark (web app + API + database in a single container)
  # ==========================================================================
  bookmark:
    image: ${BOOKMARK_IMAGE:-ghcr.io/robinedquist/bookmark:latest}
    container_name: bookmark
    restart: unless-stopped
    init: true
    # Docker's default is 10s, after which it SIGKILLs. Bookmark stops the apps
    # and then shuts the built-in database down cleanly, and a large database
    # can take a while to checkpoint - being killed midway forces WAL recovery
    # on the next start. The full time is only used if it is actually needed.
    stop_grace_period: 2m
    environment:
      # Database - left unset, so Bookmark runs its own PostgreSQL and stores it
      # in the app data volume below. To use a Postgres server you already run,
      # set DATABASE_URL in .env; nothing else changes.
      DATABASE_URL: ${DATABASE_URL:-}

      # Public URL - used for auth callbacks, CORS, etc.
      # Defaults to localhost for local try-outs; set PUBLIC_URL for any real deployment
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3001}
      UI_URL: ${PUBLIC_URL:-http://localhost:3001}

      # Auth secret - auto-generated and persisted under /data on first start if unset
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}

      # Application
      NODE_ENV: production
      APP_DATA_PATH: /data

      # Timezone for rendering dates and times. Set TZ in .env to your own zone
      # (e.g. Europe/Stockholm) - the UTC fallback is rarely the clock you read.
      TZ: ${TZ:-UTC}

      # OIDC Configuration (optional)
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

      # Integrations (optional)
      TRACKER_CLIENT_URL: ${TRACKER_CLIENT_URL:-}
      TRACKER_CLIENT_API_KEY: ${TRACKER_CLIENT_API_KEY:-}

      # Update checks (optional) - see example.env
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
    volumes:
      # Application data: the built-in database, covers, cache, and the
      # auto-generated auth secret. Back this up (see README - a file copy of a
      # running database is not a valid backup; use pg_dump).
      #
      # This has to be local disk. The built-in database cannot run on an SMB
      # share and Bookmark will refuse to start if you point it at one; your
      # media below can live anywhere.
      - ${DATA_PATH:-./data}/app:/data
      # Audiobook library - mount your media folder here
      - ${AUDIOBOOK_LIBRARY_PATH:-./media/audiobooks}:/library/audiobooks:ro
      # Writable location for AI-generated audiobooks. Only needed if you use
      # the tts profile; TTS writes to <library>/generated, which has to be a
      # separate writable mount because the library itself is read-only.
      #
      # Commented out by default because Docker cannot create the mountpoint
      # inside a read-only mount: with this enabled and no "generated" folder
      # already in your library, the container fails to start with
      # "create mountpoint ...: read-only file system".
      #
      # To use TTS: create the folder in your audiobook library first
      #   mkdir -p "$AUDIOBOOK_LIBRARY_PATH/generated"
      # then uncomment the line below. It shadows that folder, so anything
      # already inside it becomes invisible to Bookmark.
      # - ${DATA_PATH:-./data}/generated-audiobooks:/library/audiobooks/generated
      # Ebook library - mount your media folder here
      - ${EBOOK_LIBRARY_PATH:-./media/ebooks}:/library/ebooks:ro
      # Comic library - mount your media folder here
      - ${COMIC_LIBRARY_PATH:-./media/comics}:/library/comics:ro
    ports:
      - "${PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3000/api/health && curl -f http://localhost:3001",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ==========================================================================
  # TTS engine for AI-narrated audiobooks (optional)
  #
  # Start with: docker compose --profile tts up -d
  # Then enter http://tts:8880 as the server URL in Settings -> Integrations.
  # Any OpenAI-compatible /v1/audio/speech server works here; the image below
  # is a CPU-friendly default and can be swapped freely (AMD GPU users can
  # try the ghcr.io/remsky/kokoro-fastapi-rocm variant of it).
  # ==========================================================================
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: bookmark-tts
    restart: unless-stopped
    profiles: ["tts"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
